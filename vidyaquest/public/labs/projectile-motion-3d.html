<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Projectile Motion & Gravity Lab — Physics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1120; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="canvas-container" class="fixed inset-0"></div>

  <div class="pointer-events-none fixed inset-x-0 top-0 z-10 flex flex-wrap items-start justify-between gap-3 p-4">
    <div class="pointer-events-auto rounded-2xl border border-white/15 bg-slate-900/75 px-4 py-3 backdrop-blur-xl">
      <span class="text-[10px] font-bold uppercase tracking-widest text-amber-400">Physics · Kinematics 3D</span>
      <h1 class="text-base font-bold text-white">Projectile Motion & Trajectory Lab</h1>
      <p class="text-[11px] text-slate-300">Explore parabolic motion across Earth, Moon & Mars gravity</p>
    </div>

    <div class="pointer-events-auto grid grid-cols-3 gap-3 rounded-2xl border border-white/15 bg-slate-900/75 px-4 py-2.5 text-center backdrop-blur-xl">
      <div>
        <span class="block text-[10px] text-slate-400">Range (R)</span>
        <strong id="hud-range" class="text-sm font-bold text-emerald-400">0.0 m</strong>
      </div>
      <div>
        <span class="block text-[10px] text-slate-400">Max Height</span>
        <strong id="hud-height" class="text-sm font-bold text-sky-400">0.0 m</strong>
      </div>
      <div>
        <span class="block text-[10px] text-slate-400">Flight Time</span>
        <strong id="hud-time" class="text-sm font-bold text-amber-400">0.0 s</strong>
      </div>
    </div>
  </div>

  <div class="pointer-events-none fixed inset-x-0 bottom-0 z-10 flex flex-wrap items-end justify-between gap-3 p-4">
    <div class="pointer-events-auto w-full max-w-sm space-y-3 rounded-2xl border border-white/15 bg-slate-900/80 p-4 backdrop-blur-xl">
      <div>
        <div class="flex justify-between text-xs font-semibold">
          <span>Launch Angle (θ)</span>
          <span id="val-angle" class="text-amber-400">45°</span>
        </div>
        <input id="slider-angle" type="range" min="15" max="75" value="45" class="mt-1 w-full accent-amber-400" />
      </div>
      <div>
        <div class="flex justify-between text-xs font-semibold">
          <span>Initial Velocity (v₀)</span>
          <span id="val-vel" class="text-sky-400">18 m/s</span>
        </div>
        <input id="slider-vel" type="range" min="8" max="28" value="18" class="mt-1 w-full accent-sky-400" />
      </div>
      <div class="flex items-center justify-between gap-2 pt-1">
        <select id="select-g" class="rounded-lg border border-white/15 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-white">
          <option value="9.81">Earth (9.81 m/s²)</option>
          <option value="1.62">Moon (1.62 m/s²)</option>
          <option value="3.72">Mars (3.72 m/s²)</option>
        </select>
        <button id="btn-launch" class="rounded-lg bg-amber-400 px-4 py-1.5 text-xs font-bold text-slate-950 transition hover:bg-amber-300 cursor-pointer">
          Launch Sphere
        </button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1120);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 12, 26);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(10, 18, 10);
    scene.add(dir);

    const grid = new THREE.GridHelper(60, 30, 0x334155, 0x1e293b);
    scene.add(grid);

    const originX = -14;
    const launcher = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.45, 2.2, 16),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.4, roughness: 0.3 })
    );
    launcher.position.set(originX, 0.6, 0);
    scene.add(launcher);

    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xea580c, emissiveIntensity: 0.4 })
    );
    ball.position.set(originX, 0.45, 0);
    scene.add(ball);

    let arcLine = null;
    let angle = 45;
    let v0 = 18;
    let g = 9.81;
    let flying = false;
    let t = 0;

    function computeMetrics() {
      const rad = (angle * Math.PI) / 180;
      const tFlight = (2 * v0 * Math.sin(rad)) / g;
      const range = v0 * Math.cos(rad) * tFlight;
      const maxH = (v0 * v0 * Math.sin(rad) * Math.sin(rad)) / (2 * g);
      document.getElementById("hud-range").textContent = range.toFixed(1) + " m";
      document.getElementById("hud-height").textContent = maxH.toFixed(1) + " m";
      document.getElementById("hud-time").textContent = tFlight.toFixed(2) + " s";
      launcher.rotation.z = -(Math.PI / 2 - rad);

      if (arcLine) scene.remove(arcLine);
      const pts = [];
      const scale = 0.45;
      for (let i = 0; i <= 50; i++) {
        const ti = (i / 50) * tFlight;
        const px = originX + v0 * Math.cos(rad) * ti * scale;
        const py = 0.45 + (v0 * Math.sin(rad) * ti - 0.5 * g * ti * ti) * scale;
        pts.push(new THREE.Vector3(px, Math.max(0.45, py), 0));
      }
      arcLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0xfbbf24 })
      );
      scene.add(arcLine);
    }

    document.getElementById("slider-angle").addEventListener("input", (e) => {
      angle = parseFloat(e.target.value);
      document.getElementById("val-angle").textContent = angle + "°";
      computeMetrics();
    });
    document.getElementById("slider-vel").addEventListener("input", (e) => {
      v0 = parseFloat(e.target.value);
      document.getElementById("val-vel").textContent = v0 + " m/s";
      computeMetrics();
    });
    document.getElementById("select-g").addEventListener("change", (e) => {
      g = parseFloat(e.target.value);
      computeMetrics();
    });
    document.getElementById("btn-launch").addEventListener("click", () => {
      t = 0;
      flying = true;
    });

    computeMetrics();

    function animate() {
      requestAnimationFrame(animate);
      if (flying) {
        t += 0.035;
        const rad = (angle * Math.PI) / 180;
        const scale = 0.45;
        const px = originX + v0 * Math.cos(rad) * t * scale;
        const py = 0.45 + (v0 * Math.sin(rad) * t - 0.5 * g * t * t) * scale;
        if (py <= 0.45 && t > 0.1) {
          ball.position.y = 0.45;
          flying = false;
        } else {
          ball.position.set(px, py, 0);
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
